[package]
name = "kebab-mes"
version = "2.5.141"
description = "Kebab MES — System zarządzania produkcją"
authors = []
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Build kiosku rozbioru: cichy auto-update w tle (bez dialogu — nikt nie ma
# dostępu do Windowsa żeby kliknąć "zainstaluj") i blokuje zamknięcie okna.
kiosk = []
# Build PRÓBNY PROTRIMA (pl.protrima.test): bez sprawdzania aktualizacji przy starcie.
# Próba nie ma kanału aktualizacji — nowa wersja to nowy instalator z CI.
proba = []
# PROTRIMA produkcja (pilot): jak próba — bez sprawdzania aktualizacji starego MES.
protrima = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skan z NAPS2 wraca jako PDF — do frontendu idzie base64 (tablica bajtów
# w JSON puchnie kilkukrotnie).
base64 = "0.22"
# Print Schema (PrintCapabilities / PrintTicket) — okno druku.
quick-xml = "0.36"
# Tauri używa tokio wewnętrznie (tranzytywnie) — deklarujemy jawnie tylko po
# to, żeby móc użyć tokio::time::sleep w pętli cichego sprawdzania aktualizacji
# w kiosku; wersja "1" ujednolici się z tym, co i tak ciągnie Tauri.
tokio = { version = "1", features = ["time", "sync"] }
# Most wagowy RS232 (HMI rozbiór v10): odczyt wagi najazdowej z portu
# szeregowego. default-features=false — bez enumeracji udev, port otwieramy
# po nazwie z configu (COM3), co kompiluje się czysto na Linux/Windows.
serialport = { version = "4", default-features = false }

# Okno druku (druk/win.rs): drukarki, Print Schema, DEVMODE, druk na kontekście GDI.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Graphics_Printing_PrintTicket", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
# PDF strony z WebView2 (DevTools Page.printToPDF). pdfium.dll (instalator) ładowana wprost w druk/win.rs.
webview2-com = "0.38"
