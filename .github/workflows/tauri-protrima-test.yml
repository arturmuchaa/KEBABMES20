name: PROTRIMA Test — build próbny (Windows, tylko artefakt)

# Build PRÓBNEJ aplikacji biurowej PROTRIMA (pl.protrima.test), backend próby :8090.
# Niczego nie publikuje: brak kanału aktualizacji, brak GitHub Release, brak sekretów podpisu.
# Instalator jest wyłącznie artefaktem tego przebiegu.
# Nowy instalator = podbicie "version" w src-tauri/tauri.protrima-test.conf.json + push gałęzi.

on:
  push:
    branches:
      - protrima-ui
    paths:
      - 'kebab_fixed/src-tauri/tauri.protrima-test.conf.json'
      - '.github/workflows/tauri-protrima-test.yml'
  workflow_dispatch: {}

concurrency:
  group: protrima-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kebab_fixed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './kebab_fixed/src-tauri -> target'
          key: protrima-test

      - name: Strażnik konfiguracji próby
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.protrima-test.conf.json -Raw | ConvertFrom-Json
          $bledy = @()
          if ($c.identifier -ne 'pl.protrima.test') { $bledy += "identifier = $($c.identifier)" }
          if ($c.bundle.createUpdaterArtifacts) { $bledy += 'createUpdaterArtifacts musi być false' }
          if ($c.build.beforeBuildCommand -notmatch '--mode proba') { $bledy += 'build frontu bez --mode proba' }
          if ($c.app.security.csp -match ':8080') { $bledy += 'CSP dopuszcza produkcję (:8080)' }
          if (($c.plugins.updater.endpoints -join ' ') -match ':8080') { $bledy += 'updater wskazuje produkcję' }
          if (-not (Select-String -Path src-tauri/Cargo.toml -Pattern '^\s*proba\s*=' -Quiet)) { $bledy += 'brak funkcji proba w Cargo.toml' }
          if ($bledy.Count) { $bledy | ForEach-Object { Write-Host "##[error]$_" }; exit 1 }
          Write-Host "Konfiguracja próby OK: $($c.productName) $($c.version)"

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@^2

      - name: Ikony PROTRIMA (tylko w tym przebiegu)
        run: npx tauri icon public/brand/PROTRIMA_ikona_1024px.png

      - name: Build PROTRIMA Test (NSIS, bez podpisu aktualizacji)
        run: npx tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.protrima-test.conf.json --features proba

      - name: Paczka wskazuje serwer próby
        shell: pwsh
        run: |
          $hit = Get-ChildItem dist/assets/*.js | Select-String -Pattern '91\.98\.105\.107:8090' -List
          if (-not $hit) { Write-Host '##[error]Brak adresu :8090 w paczce — build bez --mode proba?'; exit 1 }
          Write-Host "Adres próby w: $(($hit | ForEach-Object { $_.Filename }) -join ', ')"

      # Zmiana w lib.rs (funkcja proba) nie może zepsuć buildów produkcji.
      - name: cargo check — build biurowy (bez funkcji)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: cargo check — build kiosku
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --features kiosk

      - name: Instalator
        id: meta
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host '##[error]Brak instalatora NSIS'; exit 1 }
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name) ($([math]::Round($exe.Length/1MB, 1)) MB)"

      - name: Upload artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: PROTRIMA-Test-Windows
          path: ${{ steps.meta.outputs.exe_path }}
          retention-days: 14
