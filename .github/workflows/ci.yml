name: CI

# UWAGA na strukturę repo: kod aplikacji mieszka w podkatalogu kebab_fixed/,
# a GitHub Actions czyta workflowy WYŁĄCZNIE z .github/workflows/ w korzeniu.
# Wcześniejsza wersja tego pliku leżała w kebab_fixed/.github/workflows/ i przez
# to nie uruchomiła się ani razu — stąd wszystkie ścieżki poniżej z prefiksem.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Bramka frontendu: typy + testy jednostkowe + build produkcyjny.
  # Dokładnie te komendy, na których opiera się weryfikacja przy pracy lokalnej.
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kebab_fixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kebab_fixed/package-lock.json
      - run: npm ci
      - name: Typy (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Testy jednostkowe (vitest)
        run: npm test
      - name: Build produkcyjny
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kebab_fixed/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_dev.txt
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    # INFORMACYJNY, nie blokuje bramki deployu. Te testy nigdy nie działały
    # w CI (workflow leżał poza korzeniem repo) i mają dziś dwie wady:
    #   1. zoom.spec.ts jest nieaktualny wobec implementacji useZoom,
    #   2. reszta specow woła /api/auth/login — w CI nie ma backendu ani
    #      zasianej bazy z kontem testowym.
    # Zdjąć continue-on-error, gdy powstanie zasiane środowisko testowe.
    continue-on-error: true
    defaults:
      run:
        working-directory: kebab_fixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kebab_fixed/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: kebab_fixed/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build obraz produkcyjny
        run: docker build -f kebab_fixed/deploy/Dockerfile -t kebab-mes:ci kebab_fixed
