name: CI

# UWAGA na strukturę repo: kod aplikacji mieszka w podkatalogu kebab_fixed/,
# a GitHub Actions czyta workflowy WYŁĄCZNIE z .github/workflows/ w korzeniu.
# Wcześniejsza wersja tego pliku leżała w kebab_fixed/.github/workflows/ i przez
# to nie uruchomiła się ani razu — stąd wszystkie ścieżki poniżej z prefiksem.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Bramka frontendu: typy + testy jednostkowe + build produkcyjny.
  # Dokładnie te komendy, na których opiera się weryfikacja przy pracy lokalnej.
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kebab_fixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kebab_fixed/package-lock.json
      - run: npm ci
      - name: Typy (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Testy jednostkowe (vitest)
        run: npm test
      - name: Build produkcyjny
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kebab_fixed/backend
    # Postgres, bo BEZ NIEGO testy bazodanowe CICHO SIĘ POMIJAŁY (fixture `db`
    # robi `skip`, gdy nie ma `TEST_DATABASE_URL`). Zielone CI nie mówiło więc
    # nic o warstwie, w której mieszka logika kilogramów i dokumentów —
    # a to ponad setka plików testów. Regresja w rozchodzie magazynu mogła
    # przejechać przez bramkę deployu niezauważona (19.09.2026).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: p
          POSTGRES_DB: kebab_mes_test
        ports:
          - 5432:5432
        # Bez health-checku krok „schemat" potrafi wystartować, zanim baza
        # przyjmuje połączenia — i pada na gotowym już runnerze.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nazwa MUSI zawierać `kebab_mes_test`: conftest ma bezpiecznik, który
      # odmawia TRUNCATE na bazie o innej nazwie (ochrona produkcji).
      TEST_DATABASE_URL: postgresql://postgres:p@localhost:5432/kebab_mes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_dev.txt
      # Skan HDI prostuje się przez `tesseract` (OSD) i `poppler` (pdftoppm,
      # pdfimages). Bez nich `prepare_scan` łapie wyjątek i ODDAJE ORYGINAŁ —
      # kod się nie wywraca, tylko cicho nie robi swojego, a test archiwum
      # słusznie to wyłapuje. Produkcja te narzędzia ma; runner nie miał.
      - name: Narzędzia skanu HDI (tesseract, poppler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      # Schemat zakładamy DOKŁADNIE tak, jak opisuje `tests/conftest.py`:
      # najpierw `init_db.SCHEMA`, potem migracje — czyli to samo, co robi
      # backend przy starcie. Dzięki temu CI sprawdza także migracje.
      - name: Schemat bazy testowej
        run: |
          python -c "import psycopg2, init_db, os; \
            c = psycopg2.connect(os.environ['TEST_DATABASE_URL']); \
            c.autocommit = True; c.cursor().execute(init_db.SCHEMA)"
          DATABASE_URL="$TEST_DATABASE_URL" python -c \
            "from app.migrations import run_migrations; run_migrations()"
      - name: Testy (z bazą)
        run: pytest -q
      # Strażnik: gdyby ktoś zdjął usługę Postgresa albo zmienną, testy DB
      # wróciłyby do cichego pomijania i CI znowu świeciłoby na zielono,
      # nie sprawdzając niczego. Pomięty test DB ma zapalić CI na czerwono.
      - name: Testy bazodanowe NAPRAWDĘ się wykonały
        run: |
          POMINIETE=$(pytest -q tests/test_batch_byproducts_db.py 2>&1 | grep -c "skipped" || true)
          if [ "$POMINIETE" != "0" ]; then
            echo "::error::Testy bazodanowe zostały POMINIĘTE — brak TEST_DATABASE_URL albo bazy."
            exit 1
          fi

  e2e:
    name: e2e — prawdziwy stos (obraz produkcyjny + zasiana baza)
    runs-on: ubuntu-latest
    # Do 19.08.2026 to zadanie nie sprawdzało NICZEGO: nie było backendu ani
    # konta testowego, więc specy padały na pierwszym logowaniu. Teraz stawiamy
    # ten sam obraz, który idzie na produkcję, na świeżej bazie z zasianą jedną
    # dostawą — i przechodzimy trzy ścieżki, bez których biuro rano nie ruszy.
    #
    # Nadal `continue-on-error`: dopóki nie pochodzi kilku tygodni bez fałszywych
    # alarmów, nie ma prawa blokować wdrożenia. Zdjąć, gdy się ustabilizuje.
    continue-on-error: true
    # Krok `playwright install --with-deps` potrafi na runnerach GitHuba trwać
    # od 2 minut do PONAD GODZINY (19.08.2026 zmierzone: 2m19s, 22m, 1h41m).
    # Przebieg zostawał wtedy „in_progress", a bramka deployu czeka na CI
    # ZAKOŃCZONE — zadanie informacyjne blokowało wdrożenia na godziny.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kebab_e2e
          POSTGRES_USER: kebab
          POSTGRES_PASSWORD: kebab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kebab -d kebab_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: kebab_fixed
    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj obraz produkcyjny
        run: docker build -f deploy/Dockerfile -t kebab-mes:e2e .

      - name: Uruchom MES na świeżej bazie
        # --network host: kontener widzi postgresa usługi CI na localhost:5432
        # i sam wystawia 8000 na hoście, gdzie czeka Playwright.
        run: |
          docker run -d --name mes --network host \
            -e DATABASE_URL=postgresql://kebab:kebab@localhost:5432/kebab_e2e \
            -e BIND=0.0.0.0:8000 -e WEB_CONCURRENCY=2 -e LOG_LEVEL=WARNING \
            kebab-mes:e2e

      - name: Czekaj, aż MES wstanie
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s http://localhost:8000/api/health || true)" = "true" ]; then
              echo "MES gotowy po ${i}. próbie"; exit 0
            fi
            sleep 2
          done
          echo "MES nie wstał — logi kontenera:"; docker logs mes; exit 1

      - name: Zasiej dane (konto biura + jedna dostawa)
        run: docker exec -i mes python - < e2e/seed_e2e.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kebab_fixed/package-lock.json
      - run: npm ci

      # Przeglądarka z cache. Bez tego `playwright install` na runnerach
      # GitHuba trwa od 2 minut do ponad godziny (19.08.2026: 2m19s, 22m,
      # 1h41m) i to ON, a nie testy, zjadał limit czasu zadania.
      - name: Cache przeglądarek Playwrighta
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('kebab_fixed/package-lock.json') }}

      - name: Pobierz przeglądarkę (tylko przy pudle w cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Zależności systemowe przeglądarki (przy trafieniu w cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Smoke po prawdziwym stosie
        run: E2E_BASE_URL=http://localhost:8000 npx playwright test e2e/smoke.spec.ts

      - name: Logi MES-a, gdy smoke padnie
        if: ${{ failure() }}
        run: docker logs mes | tail -80

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: kebab_fixed/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build obraz produkcyjny
        run: docker build -f kebab_fixed/deploy/Dockerfile -t kebab-mes:ci kebab_fixed
