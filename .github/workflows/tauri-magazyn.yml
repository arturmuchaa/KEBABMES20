name: Build Tauri — Magazyn HMI (Windows)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'magazyn-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './kebab_fixed/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install
        working-directory: kebab_fixed

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@^2
        working-directory: kebab_fixed

      - name: Generate icons
        run: npx tauri icon src-tauri/app-icon.png
        working-directory: kebab_fixed

      - name: Build Tauri Magazyn (Windows NSIS, signed for silent auto-update)
        run: npx tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.magazyn.conf.json --features kiosk
        working-directory: kebab_fixed
        env:
          # Adres i tak przegrywa z kodem (`SERWER_MES` w src/lib/api.ts) — kiosk
          # bierze serwer stamtąd, żeby zmienna z CI nie mogła go cicho podmienić.
          # Trzymamy tu Falkenstein, żeby plik nie niósł nieaktualnego adresu.
          VITE_API_URL: 'http://91.98.105.107:8080'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Get artifact info
        id: meta
        shell: pwsh
        run: |
          $VERSION = (Select-String -Path "kebab_fixed/src-tauri/tauri.magazyn.conf.json" -Pattern '"version":\s*"(.+)"').Matches[0].Groups[1].Value
          $BUNDLE = "kebab_fixed/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $EXE = Get-ChildItem "$BUNDLE/*.exe" | Select-Object -First 1
          $SIG = Get-ChildItem "$BUNDLE/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          # UWAGA: nie przepuszczamy treści .sig (wieloliniowa) przez $GITHUB_OUTPUT —
          # prosta składnia "key=value" psuje się na wartościach z osadzonymi
          # nowymi liniami. Przekazujemy tylko sig_path i czytamy podpis na nowo
          # w kroku publikacji, na tym samym runnerze.
          "version=$VERSION"          >> $env:GITHUB_OUTPUT
          "exe_path=$($EXE.FullName)" >> $env:GITHUB_OUTPUT
          "exe_name=$($EXE.Name)"     >> $env:GITHUB_OUTPUT
          "sig_path=$(if ($SIG) { $SIG.FullName } else { '' })" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $VERSION | EXE: $($EXE.Name) ($([math]::Round($EXE.Length/1MB, 1)) MB) | SIG: $(if ($SIG) { $SIG.Name } else { 'BRAK!' })"

      - name: Publish installer to VPS silent-updater (magazyn channel)
        # BEZ continue-on-error: porażka publikacji MA zapalić run na czerwono.
        # Zielony build przy niedziałającej publikacji oznacza kiosk, który cicho
        # stoi na starej wersji. Kroki niżej mają `if: always()`, więc instalator
        # zostaje do odzyskania także po nieudanej publikacji.
        shell: pwsh
        env:
          KEBAB_UPDATER_ADMIN_TOKEN: ${{ secrets.KEBAB_UPDATER_ADMIN_TOKEN }}
        run: |
          # Falkenstein = produkcja. Stary adres w Helsinkach odpowiada dziś 308
          # i cicho gubił publikację (POST bez -L).
          $pub = 'http://91.98.105.107:8080/api/admin/desktop-updates/magazyn/publish'
          $tok = ("$env:KEBAB_UPDATER_ADMIN_TOKEN" -replace '[^\x21-\x7e]', '')
          if ([string]::IsNullOrWhiteSpace($tok)) {
            Write-Host "KEBAB_UPDATER_ADMIN_TOKEN brak; pomijam publikację cichej aktualizacji (artefakt i tak zostanie wgrany do GitHub Release)."
            exit 0
          }

          $sigPath = "${{ steps.meta.outputs.sig_path }}"
          if ([string]::IsNullOrWhiteSpace($sigPath) -or -not (Test-Path $sigPath)) {
            Write-Host "Brak pliku .sig (sekrety TAURI_SIGNING_* nieustawione?) — pomijam publikację, kiosk nie zweryfikowałby niepodpisanej aktualizacji."
            exit 0
          }
          $SIGNATURE = (Get-Content $sigPath -Raw).Trim()

          $VERSION = "${{ steps.meta.outputs.version }}"
          $FILENAME = "${{ steps.meta.outputs.exe_name }}"
          $EXE_PATH = "${{ steps.meta.outputs.exe_path }}"
          $PUB_DATE = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ" -AsUTC)
          $NOTES = "Magazyn HMI $VERSION"

          # ${pub} w klamrach OBOWIĄZKOWO: goła zmienna przylegająca do "?"
          # gubi w interpolacji wszystko aż do najbliższego "=" włącznie
          # (bisekcja 1.0.11–1.0.14 kiosku produkcji — URL zaczynał się od "=").
          $URL = "${pub}?version=$([uri]::EscapeDataString($VERSION))&signature=$([uri]::EscapeDataString($SIGNATURE))&filename=$([uri]::EscapeDataString($FILENAME))&notes=$([uri]::EscapeDataString($NOTES))&pub_date=$([uri]::EscapeDataString($PUB_DATE))"

          Write-Host "Publikuję $FILENAME (v$VERSION) -> $pub"
          Write-Host "URL well-formed: $([uri]::IsWellFormedUriString($URL, [UriKind]::Absolute))"

          try {
            $resp = Invoke-RestMethod -Uri $URL -Method Post -Headers @{ 'X-Admin-Token' = $tok } -InFile $EXE_PATH -ContentType 'application/octet-stream'
            Write-Host "Publikacja OK: $($resp | ConvertTo-Json -Compress -Depth 5)"
          } catch {
            Write-Host "##[error]Publikacja nie powiodla sie: $($_.Exception.Message)"
            if ($_.ErrorDetails) { Write-Host "Szczegoly: $($_.ErrorDetails.Message)" }
            exit 1
          }

      - name: Upload installer artifact (backup)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MagazynHMI-Windows-Setup
          path: |
            ${{ steps.meta.outputs.exe_path }}
            ${{ steps.meta.outputs.sig_path }}
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Magazyn HMI — ${{ github.ref_name }}
          body: |
            ## Magazyn HMI — stanowisko magazynowe — Windows

            Standalone aplikacja dla panelu PC w magazynie (Windows).

            **Ekran czynności:** KARTONY (pakowanie sztuk do kartonów
            zdefiniowanych przez biuro), WYDANIE (załadunek palet na auto,
            stan auta wspólny dla wszystkich skanerów) i MROŹNIA (jeden skan
            przestawia jednostkę w obie strony). PRZYJĘCIE — w kolejnym wydaniu.

            **Cisza znaczy dobrze:** udany skan nie gra i nie miga. Panel odzywa
            się tylko wtedy, gdy trzeba zatrzymać rękę — błąd dostaje cały ekran.

            **Logowanie:** PIN operatora działu `magazyn` — biuro musi najpierw
            przypisać ludzi do tego działu (Pracownicy → dział).
            **Fullscreen**, blokady F5/F12/Alt+F4, auto-update własnym kanałem
            `magazyn` (oddzielnym od rozbioru, produkcji i masowni).

            **Instalacja (tylko za pierwszym razem):** uruchom `.exe` jako Administrator
            na komputerze panelowym. Kolejne wersje instalują się same.
          files: |
            ${{ steps.meta.outputs.exe_path }}
            ${{ steps.meta.outputs.sig_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
